[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentarmor"
version = "1.3.0"
description = "The full-stack safety layer for AI agents. 22 shields including prompt injection, toxicity, hallucination detection, data exfiltration, privilege escalation, and more — in 2 lines of code."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["ai", "agents", "llm", "safety", "security", "openai", "anthropic", "middleware"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]
ml = ["scikit-learn>=1.3.0"]
gemini = ["google-genai>=1.0.0"]
toxicity = ["detoxify>=0.5.0"]
semantic_drift = ["sentence-transformers>=2.2.0"]
benchmarks = ["datasets>=2.14.0"]
all = ["openai>=1.0.0", "anthropic>=0.25.0", "scikit-learn>=1.3.0", "google-genai>=1.0.0", "detoxify>=0.5.0", "sentence-transformers>=2.2.0"]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "scikit-learn>=1.3.0",
    "google-genai>=1.0.0",
]
docs = ["sphinx>=7.0", "furo", "sphinx-copybutton"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
filterwarnings = [
    # Suppress AgentArmor's own expected warn-mode UserWarnings in tests
    "ignore::UserWarning:agentarmor",
    "ignore:\\[AgentArmor\\]:UserWarning",
    # Suppress sklearn convergence/future warnings
    "ignore::sklearn.exceptions.ConvergenceWarning",
    "ignore::FutureWarning:sklearn",
    # Suppress google-genai / google-auth / urllib3 warnings
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning",
    "ignore::DeprecationWarning:google",
    "ignore::DeprecationWarning:urllib3",
]

[project.urls]
Homepage = "https://agentarmor.dev"
Repository = "https://github.com/ankitlade12/AgentArmor"
Documentation = "https://agentarmor.dev/docs"
