[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentarmor"
version = "1.5.0"
description = "The full-stack safety layer for AI agents, including prompt injection, toxicity, hallucination detection, data exfiltration, privilege escalation, and more — in 2 lines of code."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["ai", "agents", "llm", "safety", "security", "openai", "anthropic", "middleware"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]
ml = ["scikit-learn>=1.3.0"]
gemini = ["google-genai>=1.0.0"]
toxicity = ["detoxify>=0.5.0"]
semantic_drift = ["sentence-transformers>=2.2.0"]
drift = ["sentence-transformers>=2.2.0"]
# Head-to-head benchmark extras. numpy pin is load-bearing for D45 —
# bootstrap determinism requires a frozen major; numpy >=2 changes the
# default random-number pipeline. PyYAML for config loader.
benchmarks = ["datasets>=2.14.0", "PyYAML>=6.0,<7.0", "numpy>=1.26,<2.0"]
# Optional: local LlamaGuard via llama-cpp-python (SPEC v4 D36). Not part
# of `all` because the wheel requires a C toolchain; install separately.
head_to_head_llamaguard = ["llama-cpp-python>=0.2.0,<0.4.0"]
all = ["openai>=1.0.0", "anthropic>=0.25.0", "scikit-learn>=1.3.0", "google-genai>=1.0.0", "detoxify>=0.5.0", "sentence-transformers>=2.2.0"]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "scikit-learn>=1.3.0",
    "google-genai>=1.0.0",
    "PyYAML>=6.0,<7.0",
]
docs = ["sphinx>=7.0", "furo", "sphinx-copybutton", "Pillow>=10.0"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
filterwarnings = [
    # Suppress AgentArmor's own expected warn-mode UserWarnings in tests
    "ignore::UserWarning:agentarmor",
    "ignore:\\[AgentArmor\\]:UserWarning",
    # Suppress sklearn convergence/future warnings
    "ignore::sklearn.exceptions.ConvergenceWarning",
    "ignore::FutureWarning:sklearn",
    # Suppress google-genai type alias deprecation
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning",
    # Suppress google-auth DeprecationWarning and FutureWarning
    "ignore::DeprecationWarning:google",
    "ignore::FutureWarning:google",
    # Suppress urllib3 DeprecationWarning and NotOpenSSLWarning
    "ignore::DeprecationWarning:urllib3",
    "ignore:.*NotOpenSSLWarning.*:UserWarning",
    "ignore::urllib3.exceptions.NotOpenSSLWarning",
]

[project.urls]
Homepage = "https://agentarmor.dev"
Repository = "https://github.com/ankitlade12/AgentArmor"
Documentation = "https://agentarmor.dev/docs"
