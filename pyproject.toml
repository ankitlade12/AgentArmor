[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentarmor"
version = "0.2.0"
description = "The extensible safety layer for AI agents. Budget limits, prompt injection shields, PII filtering, and hooks in 2 lines of code."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["ai", "agents", "llm", "safety", "security", "openai", "anthropic", "middleware"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]
all = ["openai>=1.0.0", "anthropic>=0.25.0"]

[project.urls]
Homepage = "https://agentarmor.dev"
Repository = "https://github.com/yourusername/agentarmor"
Documentation = "https://agentarmor.dev/docs"
