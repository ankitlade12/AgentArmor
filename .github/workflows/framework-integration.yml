name: Optional Framework Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"

jobs:
  framework-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project and example dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install -r examples/requirements.txt

      - name: Run framework smoke tests
        run: |
          pytest tests/test_examples_smoke.py

      - name: Check provider SDK surfaces
        run: |
          python scripts/check_provider_surfaces.py

