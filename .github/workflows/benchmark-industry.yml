name: Industry Benchmarks

on:
  release:
    types: [published]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Specific dataset to run (leave empty for all)'
        required: false
        type: string
      sample_size:
        description: 'Sample size per dataset'
        required: false
        default: '500'
        type: string

jobs:
  industry-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e ".[ml]" datasets
      - name: Cache HuggingFace datasets
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-datasets-${{ hashFiles('benchmarks/adapters/*.py') }}
          restore-keys: hf-datasets-
      - name: Run industry benchmarks
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ARGS="--export benchmarks/results/industry_results.json"
          if [ -n "${{ inputs.dataset }}" ]; then
            ARGS="$ARGS --dataset ${{ inputs.dataset }}"
          fi
          if [ -n "${{ inputs.sample_size }}" ]; then
            ARGS="$ARGS --sample-size ${{ inputs.sample_size }}"
          fi
          python benchmarks/run_industry_benchmarks.py $ARGS
      - name: Generate README tables
        run: python benchmarks/results/generate_tables.py
      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: industry-benchmark-results
          path: benchmarks/results/industry_results.json
